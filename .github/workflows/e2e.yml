name: End-to-end (live site)

# Plays a real game on the deployed site with two browsers, including a real call to the AI Worker.
on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
  schedule:
    - cron: '23 6 * * *' # once a day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    # After a deploy, only when it succeeded; scheduled and manual runs always go.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        id: report
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Link the report in the run summary
        if: failure()
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo "### End-to-end tests failed"
            echo "- [Download the Playwright report and traces]($REPORT_URL), then unzip it into a fresh folder and run these from inside it (the zip holds both \`playwright-report/\` and \`test-results/\`, so unzipping into a folder that is itself called \`playwright-report\` nests the report one level too deep):"
            echo '  ```sh'
            echo '  unzip playwright-report.zip -d e2e-report && cd e2e-report'
            echo '  npx playwright show-report playwright-report   # open a test, then its trace, to step through every action with screenshots'
            echo '  npx playwright show-trace test-results/<test>/trace.zip'
            echo '  ```'
            echo "- [All runs of this workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/e2e.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
