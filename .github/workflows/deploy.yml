name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # The Worker's public address (a repository variable, not a secret). Without it the AI features stay hidden.
          VITE_GENERATE_URL: ${{ vars.VITE_GENERATE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The Worker only needs deploying when what the page sends to it (or the Worker itself) changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.diff.outputs.worker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" \
            | grep -v '\.test\.ts$' \
            | grep -qE '^(worker/|src/generation/(request|types|validate)\.ts$|src/content/topics\.ts$)'; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs after the build job's lint, tests and type check, and before the site goes live: the Worker rejects
  # request fields it does not know, so a new page against an old Worker would break the game.
  worker:
    needs: [build, changes]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Keep this exact wrangler version and --config: newer versions deploy the whole Vite site as a static Worker.
      - run: npx wrangler@4.86.0 deploy --config wrangler.toml
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Plays real games against the built site, served locally, with the real (just deployed) Worker. localhost:4173
  # is one of the Worker's allowed origins. A failure here stops the site going live.
  e2e:
    needs: [build, worker]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.worker.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The exact files the deploy job will publish.
      - uses: actions/download-artifact@v7
        with:
          name: github-pages
      - run: mkdir dist && tar -xf artifact.tar -C dist
      - name: Serve the build
        run: |
          npx vite preview --outDir dist --port 4173 --strictPort &
          curl --silent --fail --retry 10 --retry-delay 1 --retry-connrefused --output /dev/null http://localhost:4173/
      - run: npm run e2e
        env:
          E2E_URL: http://localhost:4173/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: [build, worker, e2e]
    # The Worker job may be skipped, but the Worker deploy (if any) and the e2e tests must have passed.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
